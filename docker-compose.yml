services:
  api:
    image: hashicorp/http-echo:latest
    container_name: monitoring-api
    command: ["-listen=:8080", "-text=Monitoring Service Active"]
    expose:
      - "8080"
    networks:
      - monitoring-net

  proxy:
    image: nginx:alpine
    container_name: monitoring-proxy
    ports:
      - "80:80"
    # маунт конфига nginx
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - monitoring-net

# общая сеть для взаимодействия контейнеров
networks:
  monitoring-net:
    driver: bridge
